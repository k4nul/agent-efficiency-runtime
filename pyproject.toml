[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-efficiency-runtime"
version = "0.1.2"
description = "A deterministic local execution layer that keeps bulky agent work out of model context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/aer/resources/licenses/*"]
authors = [{name = "k4nul"}]
keywords = ["ai-agent", "cli", "office", "token-efficiency", "local-runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "filelock>=3.30,<4",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pathspec>=0.12",
  "Pillow>=10",
  "platformdirs>=4",
  "pydantic>=2.7",
  "pypdf>=5",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "PyYAML>=6",
  "regex>=2024.11.6",
  "typer>=0.12,<0.28",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML>=6",
]

[project.scripts]
aer = "aer.cli:main"

[project.urls]
Repository = "https://github.com/k4nul/agent-efficiency-runtime"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aer = [
  "py.typed",
  "resources/fonts/*.ttf",
  "resources/licenses/*",
  "resources/recipes/*.yaml",
  "resources/templates/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/aer/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aer"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["pptx.*", "docx.*", "openpyxl.*", "PIL.*", "pypdf.*", "regex.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["aer.artifacts.presentation.*", "aer.patch.engine"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["aer"]
patch = ["subprocess"]
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
