name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: pytest --cov=aer --cov-report=term-missing
      - run: python -m build
      - name: Wheel smoke
        run: PYTHON=python AER_SMOKE_VENV=/tmp/aer-wheel-smoke AER_SMOKE_HOME=/tmp/aer-wheel-home scripts/wheel_smoke.sh
      - name: Source distribution smoke
        run: PYTHON=python AER_SDIST_SMOKE_ROOT=/tmp/aer-sdist-smoke scripts/sdist_smoke.sh
