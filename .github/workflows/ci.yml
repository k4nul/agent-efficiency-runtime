name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - name: Ruff lint
        if: matrix.python-version == '3.11'
        run: ruff check .
      - name: Ruff format
        if: matrix.python-version == '3.11'
        run: ruff format --check .
      - name: Mypy
        if: matrix.python-version == '3.11'
        run: mypy src
      - name: Tests
        if: matrix.python-version != '3.11'
        run: pytest
      - name: Tests with coverage
        if: matrix.python-version == '3.11'
        run: pytest --cov=aer --cov-report=term-missing
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build
      - name: Wheel smoke
        if: matrix.python-version == '3.11'
        run: PYTHON=python AER_SMOKE_VENV=/tmp/aer-wheel-smoke AER_SMOKE_HOME=/tmp/aer-wheel-home scripts/wheel_smoke.sh
      - name: Source distribution smoke
        if: matrix.python-version == '3.11'
        run: PYTHON=python AER_SDIST_SMOKE_ROOT=/tmp/aer-sdist-smoke scripts/sdist_smoke.sh
